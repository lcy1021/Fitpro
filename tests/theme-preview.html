<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="/">
  <title>DuoFit 主题场景检查</title>
  <link rel="stylesheet" href="private-coach.css?v=22">
</head>
<body>
<script src="private-coach.js?v=22"></script>
<script>
(async () => {
  // Only synthetic local fixtures; never load config.js or call a production backend.
  if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
    document.body.textContent = '此页面仅用于本机主题检查。';
    return;
  }
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') || 'dark';
  if (theme !== 'system') document.documentElement.dataset.theme = theme;
  const person = params.get('person') === 'wife' ? 'wife' : 'hus';
  const view = params.get('view') || 'onboard';
  const state = params.get('state') || 'selected';
  const html = await (await fetch('index.html', {cache:'no-store'})).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const style = parsed.querySelector('style');
  document.head.insertBefore(style, document.querySelector('link'));
  const safeBottom = Math.min(60, Math.max(0, Number(params.get('safe') || 0)));
  const fixtureStyle = document.createElement('style');
  fixtureStyle.textContent = `:root{--safe-bottom:${safeBottom}px}.tabs{padding-bottom:var(--safe-bottom)}`;
  if (params.get('large-nav') === '1') fixtureStyle.textContent += '.tabs button{font-size:18px}';
  document.head.appendChild(fixtureStyle);
  for (const child of [...parsed.body.children]) {
    if (child.tagName !== 'SCRIPT') document.body.appendChild(child);
  }
  const script = document.createElement('script');
  const inline = html.slice(html.lastIndexOf('<script>') + 8, html.lastIndexOf('<\/script>'));
  script.textContent = inline.replace('/* ---------- boot ---------- */', `
    window.themePreviewApp = {render, viewToday, viewDiet, viewTrain, viewRecord, openGoal, openFood, openCode, showRoleChoice, buildSteps, drawRun, ymd, getCheckin, onFoodText, initTabBarSpace,
      setMe:v=>{me=v;viewP=v}, setTab:v=>{tab=v}, setStore:v=>{store=v}, setCoach:v=>{privateCoach=v}, setRunState:v=>{runState=v}};
    return;
  `);
  document.body.appendChild(script);
  const app = window.themePreviewApp;
  document.querySelector("#pick").classList.remove("open");
  document.querySelector("#lm").classList.remove("splash");
  document.querySelector("#appShell").inert=false;document.querySelector("#appTabs").inert=false;
  app.initTabBarSpace();
  const date = app.ymd(new Date());
  const previous = app.ymd(new Date(Date.now() - 7*864e5));
  const coach = new window.DuoCoach({getCheckin:()=>({}), render:()=>{}, putCheckin:()=>{}, showRoleChoice:()=>app.showRoleChoice()});
  coach.mount();
  coach.member = {person, family:'local-theme-fixture'};
  coach.session = {user:{id:'local-theme-fixture'}};
  coach.profile = {...coach.blank(), goals:['建立运动习惯'], focus:['腰腹','背肩'], age:32, height:person==='hus'?172:164,
    weight:person==='hus'?76:52, target:'', health:['暂时没有'], frequency:'每周 3 次', duration:'20 分钟', equipment:['瑜伽垫'],
    notes:['希望少一点久坐，每周能坚持活动。','','下班后在家练一会儿。'], confirmedAt:new Date().toISOString()};
  coach.draft = state==='empty' ? coach.blank() : {...coach.profile, notes:[...coach.profile.notes]};
  const planAge = Math.max(0, Math.min(90, Number(params.get('plan-age') || 0)));
  const planStart = app.ymd(new Date(Date.now() - planAge*864e5));
  coach.profile.planStartDate = planStart;
  if(state==='rest'){coach.profile.health=['身体疼痛'];coach.draft.health=['身体疼痛'];}
  const planMonday = new Date(planStart+'T12:00:00');
  planMonday.setDate(planMonday.getDate()-((planMonday.getDay()+6)%7));
  coach.weeks[app.ymd(planMonday)]={plan:coach.proposedPlan(planStart),bodyStatus:coach.profile.health,reviewedAt:new Date().toISOString()};
  const dailyFixture = state==='short'?{dailyChoice:'short',dailyState:'状态不错',dailyTime:'只有 10 分钟'}:state==='daily-rest'?{dailyChoice:'rest',dailyState:'很疲惫',dailyTime:'按原计划'}:{};
  coach.h.getCheckin=day=>day===date?dailyFixture:{};
  coach.aiReady = true;
  coach.coachAI = async (mode,text) => {
    await new Promise(resolve=>setTimeout(resolve,650));
    if (text.includes('测试失败')) {coach.aiError='AI 暂时无法连接，文字已保留，可以稍后重试。'; coach.aiErrorContext=coach.step; return null;}
    return {summary:'希望每周坚持运动，我会按你的时间安排。', suggestions:{goals:['建立运动习惯']}};
  };
  coach.rpc = async () => ({});
  coach.ensurePaired = async () => {};
  app.setMe(person);
  app.setStore({checkins:Object.keys(dailyFixture).length?{[person+'_'+date]:{person,date,...dailyFixture}}:{}, measures:{
    ['hus_'+previous]:{person:'hus',date:previous,weight:76.5}, ['hus_'+date]:{person:'hus',date,weight:76},
    ['wife_'+previous]:{person:'wife',date:previous,weight:52.2}, ['wife_'+date]:{person:'wife',date,weight:52}}});
  coach.partnerTrend=[{date:previous,changeKg:0},{date,changeKg:-.3}];
  app.setCoach(coach);
  app.render();
  if (view==='onboard') {
    coach.step=Math.min(3,Math.max(0,Number(params.get('step')||0)));
    if(state==='busy'){coach.aiSending=true;coach.aiStep=coach.step;coach.chatInput='希望每周坚持运动';}
    if(state==='error'){coach.aiError='AI 暂时无法连接，文字已保留，可以稍后重试。';coach.aiErrorContext=coach.step;coach.chatInput='希望每周坚持运动';}
    if(state==='plan-busy')coach.planSending=true;
    if(coach.step===3)coach.previewPlan=coach.proposedPlan();
    coach.renderOnboard(state==='error'?coach.aiError:'');
  } else if(view==='weekly') {
    coach.weekHealth=['目前无特别不适'];
    if(state==='proposal')coach.weekProposed=coach.proposedPlan();
    coach.renderWeekly(state==='error'?'先确认这周的身体状态。':'');
  } else if(view==='daily') {
    coach.dailyState='状态不错';coach.dailyTime='只有 10 分钟';coach.renderDaily();
  } else if(view==='recover') coach.renderRecoverEntry(state==='error'?'恢复码格式不正确，请检查完整的 32 位字符。':'');
  else if(view==='recovery') {coach.recoveryCode='DEMO-DEMO-DEMO-DEMO-DEMO-DEMO-DEMO-DEMO';coach.renderRecovery();}
  else if(view==='signout')coach.renderSignoutConfirm();
  else if(view==='notice'){coach.current=null;coach.notice('暂时无法连接，请稍后重试。');}
  else if(view==='role')app.showRoleChoice();
  else if(view==='legacy-goal'){app.setCoach(null);app.openGoal();}
  else if(view==='food'){app.openFood('lunch');document.querySelector('#foodText').addEventListener('input',app.onFoodText);}
  else if(view==='family')app.openCode();
  else if(view==='workout'){const key=person==='hus'?'A':'W';app.setRunState({key,steps:app.buildSteps(key),i:0});document.querySelector('#run').classList.add('open');app.drawRun();}
  else if(['today','diet','train','record'].includes(view)){document.querySelector(`.tabs button[data-tab="${view}"]`).click();}
  document.body.dataset.previewReady='true';
})();
</script>
</body>
</html>
