<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoFit App Logo · 预览</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f8f5f1;color:#202a32;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}
  main{max-width:960px;margin:0 auto;padding:44px 24px 72px}
  h1{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}
  .intro{color:#66737e;margin:0 0 28px;line-height:1.6}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
  .card{border-radius:28px;background:#fff;box-shadow:0 10px 40px rgba(38,54,69,.06);padding:26px}
  .hero{display:flex;align-items:center;justify-content:center;min-height:400px;background:linear-gradient(135deg,#ecfaff,#fff7f6)}
  .hero img{width:min(82%,360px);border-radius:23%;box-shadow:0 22px 45px rgba(28,81,112,.16)}
  h2{font-size:15px;margin:0 0 18px}
  .sizes{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:38px 0}
  .size{text-align:center;color:#78848f;font-size:12px}
  .size img{display:block;margin:0 auto 10px;border-radius:23%;box-shadow:0 7px 16px rgba(26,51,75,.14)}
  .size.large img{width:96px;height:96px}.size.medium img{width:64px;height:64px}.size.small img{width:32px;height:32px}
  .screen{border-radius:23px;padding:25px;display:flex;align-items:center;gap:16px;background:#f4f9fc;margin-top:14px}
  .screen.dark{background:#1a202b;color:#eef2f7}
  .screen img{width:56px;height:56px;border-radius:14px}
  .screen b{font-size:17px}.screen small{display:block;color:#8493a1;margin-top:4px}
  .note{font-size:13px;color:#73818c;line-height:1.6;margin-top:20px}
  @media(max-width:700px){main{padding:26px 16px 48px}.grid{grid-template-columns:1fr}.hero{min-height:300px}}
</style>
</head>
<body>
<main>
  <h1>DuoFit App Logo</h1>
  <p class="intro">当前正式版 v3：保留两位立体云朵角色原有的发带、运动短裤、裙装与鞋子。人物放大、留白减少，主体保持鲜明蓝粉色，背景调淡为奶油白与极淡蓝粉光晕。</p>
  <div class="grid">
    <div class="card hero"><img src="duofit-app-icon-512.png?v=logo3" alt="放大后的蓝色与粉色立体云朵并肩跑步的 DuoFit App Logo"></div>
    <div class="card">
      <h2>在手机上的识别度</h2>
      <div class="sizes">
        <div class="size large"><img src="duofit-app-icon-192.png?v=logo3" alt="96 像素图标">96 px</div>
        <div class="size medium"><img src="duofit-app-icon-64.png?v=logo3" alt="64 像素图标">64 px</div>
        <div class="size small"><img src="duofit-app-icon-32.png?v=logo3" alt="32 像素图标">32 px</div>
      </div>
      <div class="screen"><img src="duofit-app-icon-192.png?v=logo3" alt=""><div><b>DuoFit</b><small>浅色界面</small></div></div>
      <div class="screen dark"><img src="duofit-app-icon-192.png?v=logo3" alt=""><div><b>DuoFit</b><small>深色界面</small></div></div>
      <p class="note">原图与 1024、512、192、180、64、32 px 版本均已放在此目录。网页图标、iPhone 主屏幕图标与 Web App 清单已接入项目。</p>
    </div>
  </div>
</main>
</body>
</html>
