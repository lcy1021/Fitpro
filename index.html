<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两个人的减脂打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFAF6; --surface:#FFFFFF; --sunk:#F6F3EE; --ink:#192024; --muted:#64748B; --faint:#94A3B8; --line:rgba(25,32,36,.07);
  --hus:#0284C7; --hus-ink:#0369A1; --hus-soft:#E0F2FE; --hus-grad:linear-gradient(135deg,#38BDF8 0%,#0284C7 100%); --hus-glow:0 8px 24px -4px rgba(2,132,199,.35);
  --wife:#FF4B72; --wife-ink:#E11D48; --wife-soft:#FFE4E6; --wife-grad:linear-gradient(135deg,#FF758C 0%,#FF4B72 100%); --wife-glow:0 8px 24px -4px rgba(255,75,114,.35);
  --sun:#F59E0B; --sun-ink:#B45309; --sun-soft:#FEF3C7; --good:#15803D; --good-soft:#DCFCE7; --lav:#7C3AED; --lav-soft:#EDE9FE;
  --danger:#C2410C; --obsidian:#181C24; --on-obsidian:#F1F5F9; --obsidian-2:#232833;
  --mesh:radial-gradient(circle at 8% 0%,rgba(255,226,209,.55) 0%,transparent 42%),radial-gradient(circle at 95% 18%,rgba(224,242,254,.7) 0%,transparent 45%),radial-gradient(circle at 50% 100%,rgba(255,228,230,.45) 0%,transparent 55%);
  --shadow:0 4px 20px -2px rgba(25,32,36,.05),0 1px 3px rgba(25,32,36,.03);
  --shadow-lift:0 12px 32px -8px rgba(25,32,36,.18);
  --radius-l:26px; --radius-m:20px; --radius-s:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#191D24; --sunk:#222731; --ink:#EEF1F4; --muted:#9AA5B4; --faint:#6B7684; --line:rgba(255,255,255,.08);
    --hus:#38BDF8; --hus-ink:#7DD3FC; --hus-soft:#0C3246; --wife:#FF7A95; --wife-ink:#FDA4B8; --wife-soft:#4A1E2A;
    --sun:#FBBF24; --sun-ink:#FCD34D; --sun-soft:#3D2F12; --good:#4ADE80; --good-soft:#12301F; --lav:#C4B5FD; --lav-soft:#2A2145; --danger:#FB923C; --obsidian:#0B0D11; --obsidian-2:#1A1F28;
    --mesh:radial-gradient(circle at 8% 0%,rgba(255,120,67,.10) 0%,transparent 42%),radial-gradient(circle at 95% 18%,rgba(56,189,248,.10) 0%,transparent 45%);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 4px 20px -4px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191D24; --sunk:#222731; --ink:#EEF1F4; --muted:#9AA5B4; --faint:#6B7684; --line:rgba(255,255,255,.08);
  --hus:#38BDF8; --hus-ink:#7DD3FC; --hus-soft:#0C3246; --wife:#FF7A95; --wife-ink:#FDA4B8; --wife-soft:#4A1E2A;
  --sun:#FBBF24; --sun-ink:#FCD34D; --sun-soft:#3D2F12; --good:#4ADE80; --good-soft:#12301F; --lav:#C4B5FD; --lav-soft:#2A2145; --danger:#FB923C; --obsidian:#0B0D11; --obsidian-2:#1A1F28;
  --mesh:radial-gradient(circle at 8% 0%,rgba(255,120,67,.10) 0%,transparent 42%),radial-gradient(circle at 95% 18%,rgba(56,189,248,.10) 0%,transparent 45%);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 4px 20px -4px rgba(0,0,0,.4);
}
/* 当前身份色：跟随"我是谁" */
.me-hus{--me:var(--hus);--me-ink:var(--hus-ink);--me-soft:var(--hus-soft);--me-grad:var(--hus-grad);--me-glow:var(--hus-glow);
  --mesh:radial-gradient(circle at 10% 0%,rgba(186,230,253,.75) 0%,transparent 45%),radial-gradient(circle at 100% 22%,rgba(255,226,209,.55) 0%,transparent 42%),radial-gradient(circle at 40% 100%,rgba(224,242,254,.7) 0%,transparent 55%)}
.me-wife{--me:var(--wife);--me-ink:var(--wife-ink);--me-soft:var(--wife-soft);--me-grad:var(--wife-grad);--me-glow:var(--wife-glow);
  --mesh:radial-gradient(circle at 10% 0%,rgba(255,205,215,.75) 0%,transparent 45%),radial-gradient(circle at 100% 22%,rgba(255,236,210,.55) 0%,transparent 42%),radial-gradient(circle at 40% 100%,rgba(255,228,230,.75) 0%,transparent 55%)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .me-hus{--mesh:radial-gradient(circle at 10% 0%,rgba(56,189,248,.14) 0%,transparent 45%),radial-gradient(circle at 100% 30%,rgba(255,120,67,.07) 0%,transparent 42%)}
  :root:not([data-theme="light"]) .me-wife{--mesh:radial-gradient(circle at 10% 0%,rgba(255,75,114,.15) 0%,transparent 45%),radial-gradient(circle at 100% 30%,rgba(255,170,90,.07) 0%,transparent 42%)}
}
:root[data-theme="dark"] .me-hus{--mesh:radial-gradient(circle at 10% 0%,rgba(56,189,248,.14) 0%,transparent 45%)}
:root[data-theme="dark"] .me-wife{--mesh:radial-gradient(circle at 10% 0%,rgba(255,75,114,.15) 0%,transparent 45%)}
.hus{--p:var(--hus);--p-ink:var(--hus-ink);--p-soft:var(--hus-soft);--p-grad:var(--hus-grad);--p-glow:var(--hus-glow)}
.wife{--p:var(--wife);--p-ink:var(--wife-ink);--p-soft:var(--wife-soft);--p-grad:var(--wife-grad);--p-glow:var(--wife-glow)}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--mesh),var(--bg);background-attachment:fixed;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s,transform .1s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--me) 45%,transparent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:10px 16px 104px}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top .title{flex:1;min-width:0}
.top .tile{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--me);flex:none}
.top .tile svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:6px}
.top h1::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--me)}
.date{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{display:flex;align-items:center;gap:2px;border:0;border-radius:999px;padding:4px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700}
.role .r{padding:5px 11px;border-radius:999px;color:var(--faint)}
.role .sw{color:var(--faint);font-size:12px}
.me-hus .role .r.hus{background:var(--hus-soft);color:var(--hus-ink)}
.me-wife .role .r.wife{background:var(--wife-soft);color:var(--wife-ink)}
.me-ava{width:44px;height:44px;border-radius:50%;background:var(--me-soft);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--me);object-fit:contain;padding:3px;flex:none}

/* role picker & code dialog */
.pick{position:fixed;inset:0;z-index:40;background:var(--mesh),var(--bg);display:none;overflow:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pick.open{display:block}
.pick .inner{max-width:420px;margin:0 auto;padding:10vh 20px 32px;display:grid;gap:14px}
.pick h1{font-size:30px;font-weight:800;margin-bottom:2px}
.pick .lead{color:var(--muted);font-size:14px;margin-bottom:10px}
.pick-btn{border:0;border-radius:var(--radius-l);padding:18px 20px;text-align:left;color:#fff;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;background:var(--p-grad);box-shadow:var(--p-glow)}
.pick-btn b{font-size:22px;font-weight:800}
.pick-btn span{font-size:13px;opacity:.92;grid-column:1}
.pick-btn img{grid-column:2;grid-row:1/3;width:64px;height:64px;object-fit:contain;background:rgba(255,255,255,.25);border-radius:50%;padding:4px}
.pick .cancel{border:0;background:transparent;color:var(--muted);font-size:14px;padding:10px}

/* whose plan switch */
.peek{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:4px;margin-bottom:16px}
.peek button{border:0;background:transparent;border-radius:999px;padding:8px 0;font-size:14px;color:var(--muted);font-weight:600}
.peek button[aria-pressed="true"]{background:var(--p-soft);color:var(--p-ink);font-weight:800}
.peek-note{font-size:12px;color:var(--muted);margin:-8px 6px 14px}

.sync{font-size:12px;color:var(--muted);margin:-6px 4px 12px}
.sync.warn{color:var(--danger)}

/* generic cards */
.card{background:var(--surface);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:10px}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 10px}
.sec-h h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-h h3 .si{font-style:normal;width:28px;height:28px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.sec-h span{font-size:12px;color:var(--muted);text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.me{background:var(--me-soft);color:var(--me-ink)}

/* together streak */
.together{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 10px 8px 12px;margin-bottom:14px;font-size:14px;font-weight:700}
.together .fire{width:30px;height:30px;border-radius:50%;background:var(--sun-soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.together b{font-size:18px;font-weight:800;color:var(--me-ink);margin:0 2px}
.together .t{flex:1;min-width:0}

/* duo: two tracks */
.duo{background:var(--surface);border-radius:var(--radius-l);padding:16px;margin-bottom:22px;box-shadow:var(--shadow)}
.duo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px}
.duo h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.duo h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--wife-soft);color:var(--wife);display:flex;align-items:center;justify-content:center;font-size:14px}
.track{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-m);background:color-mix(in srgb,var(--p-soft) 55%,var(--surface))}
.track+.track{margin-top:8px}
.track .ava{width:44px;height:44px;border-radius:50%;background:var(--surface);object-fit:contain;padding:3px;box-shadow:0 0 0 2px var(--p)}
.track .who{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;min-width:0}
.track .name{font-weight:800;font-size:14px;color:var(--p-ink)}
.track .last{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beads{display:flex;gap:6px}
.bead{width:28px;height:28px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--faint);flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.bead.on{background:var(--p);color:#fff;box-shadow:0 3px 8px -2px color-mix(in srgb,var(--p) 55%,transparent)}
.bead.over{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 0 0 2px var(--sun)}
.bead.skip{background:var(--sunk);color:var(--muted);box-shadow:none}
.bead.rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--faint);font-weight:500}
.streak{font-size:11px;color:var(--muted);text-align:center;min-width:40px}
.streak b{display:block;font-size:20px;color:var(--ink);font-weight:800;line-height:1.1}

/* obsidian workout card */
.obs{background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--me) 28%,transparent) 0%,transparent 55%),var(--obsidian);color:var(--on-obsidian);border-radius:var(--radius-l);padding:18px;box-shadow:var(--shadow-lift)}
.obs .tag2{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.obs h4{margin:12px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.obs p{font-size:13px;color:rgba(241,245,249,.65)}
.obs .moves-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.obs .moves-chips span{font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);white-space:nowrap}
.obs .moves-chips span em{font-style:normal;color:rgba(241,245,249,.6);margin-left:4px}
.cta{width:100%;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:var(--me-grad);box-shadow:var(--me-glow),inset 0 1px 1px rgba(255,255,255,.35)}
.obs .cta.done{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);color:rgba(241,245,249,.8)}
.obs .ol{list-style:none;margin:14px 0 16px;padding:0;display:grid;gap:8px}
.obs .ol li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);background:var(--obsidian-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.obs .ol .n{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.obs .ol h5{margin:0;font-size:14px;font-weight:700}
.obs .ol small{display:block;font-size:12px;color:rgba(241,245,249,.55);line-height:1.4}
.obs .ol .r{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--p,var(--me)) 30%,transparent);color:#fff;white-space:nowrap}

/* meals */
.meal{display:grid;gap:12px}
.meal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-top h4{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.meal-top .ic{width:36px;height:36px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.meal-top time{font-size:12px;color:var(--muted);font-weight:500}
.meal-top .kcal{font-size:12px;font-weight:800;color:var(--me-ink);background:var(--me-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.foods{margin:0;list-style:none;background:var(--sunk);border-radius:var(--radius-s);padding:4px 14px}
.foods li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;font-size:14px;font-weight:600}
.foods li+li{border-top:1px solid var(--line)}
.foods li small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.foods li b{font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.foods li b::after{content:" kcal";font-size:11px;font-weight:500;color:var(--muted)}
.meal .foods-note{font-size:12px;color:var(--muted);margin-top:-6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:0;background:var(--sunk);border-radius:999px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="plan"]{background:var(--me-grad);color:#fff;box-shadow:var(--me-glow)}
.seg button[aria-pressed="true"][data-v="over"]{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 0 0 1.5px var(--sun)}
.seg button[aria-pressed="true"][data-v="skip"]{background:var(--ink);color:var(--bg)}

.note{font-size:13px;color:var(--ink);padding:12px 14px;background:var(--sun-soft);border-radius:var(--radius-m);display:flex;gap:10px;align-items:flex-start}
.note::before{content:"🥑";font-size:16px;line-height:1.4}

.train-today{display:flex;align-items:center;justify-content:space-between;gap:12px}
.train-today h4{margin:0 0 2px;font-size:16px;font-weight:800}
.train-today p{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--me-grad);color:#fff;box-shadow:var(--me-glow)}
.btn.ghost{background:var(--sunk)}
.btn.done{background:var(--sunk);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}

.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
.counter .ic{width:40px;height:40px;border-radius:14px;background:var(--me-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.counter .txt{flex:1;min-width:0}
.counter h4{margin:0;font-size:15px;font-weight:800}
.counter p{font-size:12px;color:var(--muted);line-height:1.5}
.counter .ctl{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:4px}
.counter .ctl button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);font-size:18px;line-height:1;box-shadow:var(--shadow)}
.counter .ctl button[data-stand="1"]{background:var(--me-grad);color:#fff;box-shadow:var(--me-glow)}
.counter .ctl b{font-size:18px;font-weight:800;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.counter .ctl b small{display:block;font-size:10px;color:var(--muted);font-weight:500;line-height:1}

/* diet: kcal ring */
.ring-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .c small{font-size:11px;color:var(--muted)}
.ring-side{display:grid;justify-items:center;text-align:center;gap:6px}
.ring-side img{width:80px;height:80px;object-fit:contain}
.ring-side p{font-size:13px;color:var(--muted);line-height:1.5}
.ring-meals{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ring-meals div{background:var(--sunk);border-radius:var(--radius-s);padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.ring-meals div b{display:block;font-size:13px;color:var(--ink);font-weight:800}
.ring-meals div.plan{background:var(--p-soft)} .ring-meals div.plan b{color:var(--p-ink)}
.ring-meals div.over{background:var(--sun-soft)} .ring-meals div.over b{color:var(--sun-ink)}
.ring-foot{grid-column:1/-1;font-size:11px;color:var(--faint);text-align:center}

/* diet tab */
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list li small{display:block;color:var(--muted);font-size:12px}
.mplan{display:grid;grid-template-columns:32px 1fr;gap:4px 12px}
.mplan .l{grid-row:1/3;width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p-ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.l.m-breakfast{background:var(--sun-soft);color:var(--sun-ink)} .l.m-lunch{background:var(--good-soft);color:var(--good)} .l.m-snack{background:var(--lav-soft);color:var(--lav)}

const pad = n => String(n).padStart(2,"0");

function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y0)/864e5+1)/7);
}
/* what does each person do on a given day */
function scheduleFor(person,d){
  const w=d.getDay(); const even=isoWeek(d)%2===0;
  if(person==="hus"){
    if(w===1||w===5) return {kind:"train",w:even?"A":"B"};
    if(w===3) return {kind:"train",w:even?"B":"A"};
    if(w===6) return {kind:"flex",w:even?"B":"A"};
    return {kind:"rest"};
  }
  if(w===1||w===3) return {kind:"train",w:"W"};
  if(w===5||w===6) return {kind:"flex",w:"W"};
  return {kind:"rest"};
}

async function rpc(fn,args){
  const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY};
  if(!SUPABASE_KEY.startsWith("sb_")) headers["Authorization"]="Bearer "+SUPABASE_KEY;
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers,body:JSON.stringify(args),signal:ctl.signal});
    if(!r.ok){ const e=new Error("http "+r.status); e.status=r.status; e.text=await r.text().catch(()=> ""); throw e; }
    const txt=await r.text(); return txt?JSON.parse(txt):null;
  } finally { clearTimeout(t); }
}

let syncing=false, syncAgain=false;
async function sync(){
  if(!CLOUD || !family) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; syncState="syncing"; renderSync();
  try{
    // 1. push local changes
    const pending=dirty.slice();
    for(const key of pending){
      const [kind,id]=[key.slice(0,1),key.slice(2)];
      const body = kind==="c" ? store.checkins[id] : store.measures[id];
      if(body) await rpc(kind==="c"?"fl_put_checkin":"fl_put_measure",{p_family:family,p_id:id,p_person:body.person,p_date:body.date,p_body:body});
      dirty=dirty.filter(k=>k!==key); saveLocal();
    }
    // 2. pull everything for this family
    const since=ymd(addDays(new Date(),-120));
    const data=await rpc("fl_pull",{p_family:family,p_since:since});
    const nextC={}, nextM={};
    (data&&data.checkins||[]).forEach(r=>{ nextC[r.id]=r.body; });
    (data&&data.measures||[]).forEach(r=>{ nextM[r.id]=r.body; });
    dirty.forEach(k=>{ const id=k.slice(2); if(k[0]==="c"&&store.checkins[id]) nextC[id]=store.checkins[id]; if(k[0]==="m"&&store.measures[id]) nextM[id]=store.measures[id]; });
    store.checkins=nextC; store.measures=nextM; saveLocal();
    syncState="ok"; lastSync=new Date();
  }catch(e){
    syncState = (e && e.status) ? "error" : "offline";
    if(e && e.status) console.warn("sync error",e.status,e.text);
  }finally{
    syncing=false; render();
    if(syncAgain){ syncAgain=false; setTimeout(sync,300); }
  }
}

function dayDone(person,d){
  const c=getCheckin(person,ymd(d));
  const meals=MEALS.every(m=>c.meals && c.meals[m]);
  const s=scheduleFor(person,d);
  return meals && (s.kind!=="train" || c.workout==="done");
}
function streak(person){
  const today=new Date(); let n=0; let d=today;
  if(!dayDone(person,d)) d=addDays(d,-1);
  for(let i=0;i<365;i++){ if(dayDone(person,d)){ n++; d=addDays(d,-1);} else break; }
  return n;
}

/* 按今天打卡估算吃了多少：按计划 → 这顿的区间；吃多了 → 按这顿的上限；没吃 → 0 */
function eatenToday(person){
  const c=getCheckin(person,ymd(new Date())); let lo=0, hi=0, n=0;
  MEALS.forEach(m=>{ const v=c.meals&&c.meals[m]; if(!v) return; n++;
    const r=mealRange(MEAL_FOODS[person][m]);
    if(v==="plan"){ lo+=r[0]; hi+=r[1]; } else if(v==="over"){ lo+=r[1]; hi+=r[1]; } });
  return {lo,hi,n,c};
}

function lastCheckinAt(person){

  return t;
}
function whenText(t){
  const d=new Date(t), now=new Date(); const hm=pad(d.getHours())+":"+pad(d.getMinutes());
  if(ymd(d)===ymd(now)) return "今天 "+hm;
  if(ymd(d)===ymd(addDays(now,-1))) return "昨天 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
function measureSeries(person){
  return Object.values(store.measures).filter(m=>m.person===person).sort((a,b)=>a.date<b.date?-1:1);
}
let recField="weight";
const FIELDS={weight:["体重","kg"],waist:["腰围","cm"],hip:["臀围","cm"],thigh:["大腿围","cm"]};
/* 平滑曲线：两个人各占上下一半、各自按自己的范围缩放（体重相差大时也能看清各自的走势） */
function smoothPath(pts){
  if(pts.length<2) return "";
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function trendCard(){
  const fields=["weight","waist"].concat(measureSeries("wife").some(m=>typeof m.hip==="number")?["hip"]:[]);
  if(!fields.includes(recField)) recField="weight";
  const [label,unit]=FIELDS[recField];
  const W=320,H=170,PX=18,BAND=H/2;
  const series=["hus","wife"].map((p,bi)=>({p,bi,pts:measureSeries(p).filter(m=>typeof m[recField]==="number").slice(-12)}));
  const toggle=`<div class="seg2" role="group" aria-label="看哪项趋势">${fields.map(f=>`<button data-rec-field="${f}" aria-pressed="${f===recField}">${FIELDS[f][0]}</button>`).join("")}</div>`;
  const legend=`<div class="legend">${series.map(s=>{ const l=s.pts[s.pts.length-1]; return `<span class="${s.p}"><i></i>${PEOPLE[s.p].label}${l?` <b>${l[recField]} ${unit}</b>`:" 还没有数据"}</span>`; }).join("")}</div>`;
  if(!series.some(s=>s.pts.length)) return `<div class="card chart"><div class="chart-h"><b>两个人的趋势</b>${toggle}</div><p class="empty">记录两次以上就能看到${label}趋势</p></div>`;
  const body=series.map(s=>{
    if(!s.pts.length) return `<text x="${W/2}" y="${s.bi*BAND+BAND/2+4}" text-anchor="middle" font-size="11" fill="var(--faint)">${PEOPLE[s.p].label}还没有${label}数据</text>`;
    const vals=s.pts.map(m=>m[recField]); let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<1){ lo-=.5; hi+=.5; }
    const top=s.bi*BAND+22, bot=(s.bi+1)*BAND-12;
    const n=s.pts.length, x=i=> n===1 ? W/2 : PX+(i/(n-1))*(W-2*PX), y=v=>bot-((v-lo)/(hi-lo))*(bot-top);
    const xy=s.pts.map((m,i)=>[x(i),y(m[recField])]);
    const line=smoothPath(xy); const mine=s.p===me; const col=`var(--${s.p})`;
    const area=line?`${line} L${xy[n-1][0].toFixed(1)},${bot+8} L${xy[0][0].toFixed(1)},${bot+8} Z`:"";
    const last=xy[n-1];
    return (area?`<path d="${area}" fill="url(#fill-${s.p})"/>`:"")+
      (line?`<path d="${line}" fill="none" stroke="${col}" stroke-width="${mine?3:2.5}" stroke-linecap="round" ${mine?"":`stroke-dasharray="1 6"`}/>`:"")+
      xy.map(([cx,cy],i)=>i===n-1?"":`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.5" fill="${col}" opacity=".5"/>`).join("")+
      `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--surface)" stroke="${col}" stroke-width="3"/>`+
      `<text x="${Math.min(last[0],W-24).toFixed(1)}" y="${(last[1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${col}">${s.pts[n-1][recField]}</text>`;
  }).join("");
  const defs=`<defs>${["hus","wife"].map(p=>`<linearGradient id="fill-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--${p})" stop-opacity=".22"/><stop offset="1" stop-color="var(--${p})" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
  return `<div class="card chart"><div class="chart-h"><b>两个人的趋势</b>${toggle}</div>${legend}
    <div class="plot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}趋势，最近 12 次">${defs}<line x1="${PX}" x2="${W-PX}" y1="${BAND}" y2="${BAND}" stroke="var(--line)" stroke-dasharray="3 5"/>${body}</svg></div>
    <p class="chart-foot">最近 12 次记录 · 两人各自按自己的范围显示走势</p></div>`;
}
function whoCard(p){

  </div>`;
}
function shortDay(date){

    const pw=m.weight!=null?prevValue(m.person,"weight",m.date):null;
    return `<div class="feed ${m.person}"><img src="assets/avatar-${m.person}.png" alt="" width="40" height="40">
      <div class="t"><div><b>${PEOPLE[m.person].label}</b><span class="chip">${shortDay(m.date)}</span></div><small>${esc(extra)||"只记了体重"}</small></div>
      <div class="v">${m.weight!=null?`<b>${m.weight} kg</b><small>${pw!=null?fmtDelta(m.weight-pw,"kg"):"第一次记录"}</small>`:""}</div></div>`;
  }).join("");
}
function renderRecordData(){
  const pair=$("#recPair"); if(pair) pair.innerHTML=whoCard("hus")+whoCard("wife");
  const ins=$("#recInsight"); if(ins) ins.innerHTML=insightCard();
  const box=$("#recData"); if(!box) return;
  box.innerHTML=`<section class="sec">${secH("📈","趋势")}${trendCard()}</section>
    <section class="sec">${secH("🕒","最近更新","两个人的记录")}<div class="card">${feedRows()}</div></section>`;
}
function viewRecord(){
  const today=ymd(new Date());
  const ex=store.measures[me+"_"+today]||{};
  const v=k=>ex[k]!=null?ex[k]:"";
  const tiles=[["weight","晨起体重","kg",0.1,30,200],["waist","腰围","cm",0.5,40,160]].concat(me==="wife"?[["hip","臀围","cm",0.5,50,160],["thigh","大腿围","cm",0.5,30,100]]:[]);
  const tile=([k,l,u,st,mn,mx])=>{ const pv=prevValue(me,k,today);
    return `<label class="mtile"><span class="ml">${l}</span><span class="mv"><input type="number" inputmode="decimal" step="${st}" min="${mn}" max="${mx}" name="${k}" value="${v(k)}" placeholder="${pv!=null?pv:"—"}" data-prev="${pv!=null?pv:""}" data-unit="${u}"><i>${u}</i></span>
      <span class="md" data-delta="${k}">${pv!=null?`上次 ${pv} ${u}`:"还没有记录"}</span></label>`; };
  const tokenCard = CLOUD ? `<section class="sec">${secH("🔑","家庭同步口令")}
    <div class="card"><div class="token"><span class="k">${family?"🔒 "+esc(family.slice(0,4))+"••••••":"还没设置口令"}</span>
      ${family?`<button class="btn primary" data-code-copy>复制邀请链接</button>`:`<button class="btn primary" data-open-code>去设置</button>`}</div>
      ${family?`<button class="linkbtn" data-open-code>查看或修改口令</button>`:`<p class="empty" style="padding-top:8px">两台手机填同一个口令，数据才会同步到一起。</p>`}</div></section>` : "";
  $("#view").innerHTML=`
  <section class="sec" id="recInsight"></section>
  <section class="sec">${secH("👫","两个人的记录")}<div class="pair" id="recPair"></div></section>
  <section class="sec">${secH("📝","记录"+PEOPLE[me].label+"的数据")}
    <form class="card form2" id="mForm">
      <div class="fh"><span>记在哪天</span><input type="date" name="date" value="${today}" max="${today}" aria-label="日期"></div>
      <div class="mtiles">${tiles.map(tile).join("")}</div>
      <button class="cta" type="submit">☁️ 保存记录</button>
    </form>
  </section><div id="recData"></div>${tokenCard}`;
  renderRecordData();
  $("#mForm").addEventListener("input",e=>{
    const i=e.target; if(!i.dataset || i.name==="date") return;
    const d=$(`[data-delta="${i.name}"]`); if(!d) return;
    const pv=i.dataset.prev, u=i.dataset.unit;
    d.textContent = i.value!=="" && pv!=="" ? "较上次 "+fmtDelta(Number(i.value)-Number(pv),u) : (pv!==""?`上次 ${pv} ${u}`:"还没有记录");
  });
  $("#mForm").addEventListener("submit",e=>{
    e.preventDefault(); const f=new FormData(e.target); const body={person:me,date:f.get("date")||today};
    let any=false;
    ["weight","waist","hip","thigh"].forEach(k=>{ const raw=f.get(k); if(raw!==null && raw!==""){ const n=Number(raw); if(!isNaN(n)){ body[k]=n; any=true; } } });
    if(!any){ toast("至少填一项再保存"); return; }
    putMeasure(body); toast("已保存记录");
  });
}

function render(){
  renderHeader(); renderSync();
  if(runState) return; // don't touch views mid-workout
  if(tab==="today") viewToday();
  else if(tab==="diet") viewDiet();
  else if(tab==="train") viewTrain();
  else if(tab==="record"){ if($("#mForm") && lastTab==="record" && lastMe===me) renderRecordData(); else viewRecord(); }
  lastTab=tab; lastMe=me;
}
let lastTab=null,lastMe=null;

/* ---------- workout runner ---------- */
let runState=null, timer=null;
function buildSteps(key){
  const w=WORKOUTS[key]; const steps=[];
  if(w.warm.length) steps.push({type:"list",title:"先热身",items:w.warm,btn:"热身完成"});
  for(let r=1;r<=w.rounds;r++){
    w.moves.forEach((m,i)=>{
      steps.push({type:"move",m,round:r,idx:i+1});
      const lastMove=i===w.moves.length-1;
      if(!lastMove && w.restMove) steps.push({type:"rest",sec:w.restMove,next:w.moves[i+1].n});
      if(lastMove && r<w.rounds && w.restRound) steps.push({type:"rest",sec:w.restRound,next:"第 "+(r+1)+" 轮："+w.moves[0].n,round:true});
    });
  }
  if(w.cool.length) steps.push({type:"list",title:"放松一下",items:w.cool,btn:"放松完成"});
  steps.push({type:"end"});
  return steps;
}
function startRun(key){
  runState={key,steps:buildSteps(key),i:0,sec:0,running:false};
  $("#run").classList.add("open"); document.body.style.overflow="hidden"; drawRun();
}
function stopTimer(){ clearInterval(timer); timer=null; }
function closeRun(){ stopTimer(); runState=null; $("#run").classList.remove("open"); document.body.style.overflow=""; render(); }
function nextStep(){ stopTimer(); runState.i++; runState.running=false; drawRun(); }
const RUN_C=2*Math.PI*88;
function timerRing(sec,total){
  return `<div class="tring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--sunk)" stroke-width="14"/>
    <circle id="cdRing" cx="100" cy="100" r="88" fill="none" stroke="var(--me)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${RUN_C.toFixed(1)}" stroke-dashoffset="${(RUN_C*(1-sec/total)).toFixed(1)}"/></svg>
    <div><b class="big" id="cd">${sec}</b><small>秒</small></div></div>`;
}
function countdown(sec,onEnd){
  runState.sec=sec; runState.total=runState.total||sec; stopTimer();
  timer=setInterval(()=>{ runState.sec--; const el=$("#cd"); if(el) el.textContent=runState.sec;
    const rg=$("#cdRing"); if(rg && runState.total) rg.style.strokeDashoffset=(RUN_C*(1-runState.sec/runState.total)).toFixed(1);
    if(runState.sec<=0){ stopTimer(); try{ navigator.vibrate&&navigator.vibrate(200);}catch(e){} onEnd(); } },1000);
}
function drawRun(){
  const st=runState; const w=WORKOUTS[st.key]; const s=st.steps[st.i];
  const pct=Math.round(st.i/(st.steps.length-1)*100);
  let body="";
  if(s.type==="list"){
    st.total=0;
    body=`<div class="rcard"><span class="tag2 light">${s.title==="先热身"?"🔥 热身":"🌿 放松"}</span><h2>${s.title}</h2>
      <ol class="rlist">${s.items.map((x,i)=>`<li><span>${i+1}</span>${esc(x)}</li>`).join("")}</ol></div>
      <div class="actions"><button class="cta" data-run="next">${s.btn}</button></div>`;
  }else if(s.type==="move"){
    const timed=!!s.m.sec;
    st.total = timed ? s.m.sec : 0;
    body=`<div class="rcard"><div class="media"><img src="assets/avatar-${me}.png" alt="" width="72" height="72"><span>动作示意图待添加</span></div>
      <span class="tag2 light">第 ${s.round} 轮 · 动作 ${s.idx}/${w.moves.length}</span>
      <h2>${esc(s.m.n)}</h2><p class="reps">${esc(s.m.r)}</p><p class="cue">💡 ${esc(s.m.c)}</p></div>
      ${timed?timerRing(st.running?st.sec:s.m.sec,s.m.sec):""}
      <div class="actions">${timed&&!st.running?`<button class="cta" data-run="timer">▶ 开始计时</button>`:""}
      ${timed&&st.running?`<button class="btn ghost" data-run="next">提前结束</button>`:""}
      ${!timed?`<button class="cta" data-run="next">✓ 做完了</button>`:""}</div>`;
  }else if(s.type==="rest"){
    st.total=s.sec;
    body=`<div class="rrest"><h2>${s.round?"这一轮完成，休息一下 🎉":"休息一下"}</h2>
      ${timerRing(s.sec,s.sec)}
      <p class="next">下一个 <b>${esc(s.next)}</b></p></div>
      <div class="actions"><button class="btn ghost" data-run="next">跳过休息</button></div>`;
  }else{
    body=`<div class="rend"><img src="assets/avatar-${me}.png" alt="${PEOPLE[me].label}的形象" width="140" height="140"><h2>练完了 ✨</h2><p class="cue">${w.name}，${w.rounds} 轮全部完成。</p></div>
      <div class="actions">${w.who==="both"?"":`<button class="cta" data-run="finish">记录完成并返回</button>`}
      <button class="btn ghost" data-run="close">返回</button></div>`;
  }
  $("#runBody").innerHTML=`<div class="run-top"><button data-run="close">✕ 退出</button><span>${w.name}</span><span class="pc">${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>${body}`;
  if(s.type==="rest") countdown(s.sec,nextStep);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.pick){ me=t.dataset.pick; viewP=me; try{ localStorage.setItem(LS_ME,me);}catch(_){} closePicker(); lastTab=null; render(); if(CLOUD && !family) openCode(); return; }
  if(t.hasAttribute("data-open-code")){ openCode(); return; }
  if(t.hasAttribute("data-code-gen")){ $("#codeInput").value=genCode(); return; }
  if(t.hasAttribute("data-code-save")){
    const v=$("#codeInput").value.trim();
    if(!/^[A-Za-z0-9]{8,40}$/.test(v)){ toast("口令需要 8 位以上，只能用字母和数字"); return; }
    const changed = v!==family; family=v; try{ localStorage.setItem(LS_FAMILY,family);}catch(_){}
    if(changed){ // new family: re-upload what's on this phone
      Object.keys(store.checkins).forEach(id=>markDirty("c:"+id)); Object.keys(store.measures).forEach(id=>markDirty("m:"+id)); saveLocal();
    }
    syncState="idle"; toast("口令已保存"); showCodeShare(); sync(); return;
  }
  if(t.hasAttribute("data-code-copy")){ copyInvite(); return; }
  if(t.hasAttribute("data-code-close")){ $("#codeDlg").classList.remove("open"); document.body.style.overflow=""; lastTab=null; render(); return; }
  if(t.hasAttribute("data-pick-cancel")){ closePicker(); return; }
  if(t.hasAttribute("data-open-picker")){ openPicker(true); return; }
  if(t.dataset.view){ viewP=t.dataset.view; lastTab=null; render(); return; }
  if(t.dataset.recField){ recField=t.dataset.recField; renderRecordData(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; document.querySelectorAll(".tabs button").forEach(b=>{ if(b===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    lastTab=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.meal){
    if(readOnly){ toast("你现在只有查看权限"); return; }
    const date=ymd(new Date()); const c=JSON.parse(JSON.stringify(getCheckin(me,date)));
    c.meals=c.meals||{}; c.meals[t.dataset.meal] = c.meals[t.dataset.meal]===t.dataset.v ? null : t.dataset.v;
    if(!c.meals[t.dataset.meal]) delete c.meals[t.dataset.meal];
    putCheckin(c); return;
  }
  if(t.dataset.stand){
    if(readOnly){ toast("你现在只有查看权限"); return; }
    const date=ymd(new Date()); const c=JSON.parse(JSON.stringify(getCheckin(me,date)));
    c.stand=Math.max(0,Math.min(20,(c.stand||0)+Number(t.dataset.stand))); putCheckin(c,700); return;
  }
  if(t.hasAttribute("data-undo-workout")){
    if(readOnly) return;
    if(!confirm("撤销今天的训练打卡？")) return;
    const date=ymd(new Date()); const c=JSON.parse(JSON.stringify(getCheckin(me,date))); c.workout=null; putCheckin(c); return;
  }
  if(t.dataset.start){ startRun(t.dataset.start); return; }
  if(t.dataset.run){
    const a=t.dataset.run;
    if(a==="next") nextStep();
    else if(a==="close"){ if(runState && runState.steps[runState.i].type!=="end" && runState.i>0 && !confirm("训练还没做完，确定退出？")) return; closeRun(); }
    else if(a==="timer"){ const s=runState.steps[runState.i]; runState.running=true; runState.sec=s.m.sec; drawRun(); countdown(s.m.sec,nextStep); }
    else if(a==="finish"){
      if(!readOnly){ const date=ymd(new Date()); const c=JSON.parse(JSON.stringify(getCheckin(me,date))); c.workout="done"; runState=null; putCheckin(c); toast("训练已打卡"); }
      closeRun();
    }
  }
});

let toastT=null;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

function openPicker(canCancel){
  $("#pick").classList.add("open"); $("[data-pick-cancel]").hidden=!canCancel; document.body.style.overflow="hidden";
}
function genCode(){
  const a="ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"; const r=new Uint32Array(14);
  (window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*4e9)}).getRandomValues(r);
  return Array.from(r,x=>a[x%a.length]).join("");
}
function inviteLink(){ return location.origin+location.pathname+"#k="+family; }
function showCodeShare(){ $("#codeShare").hidden=false; $("[data-code-copy]").hidden=false; $("[data-code-close]").hidden=false; }
function openCode(){
  $("#codeInput").value=family; $("#codeDlg").classList.add("open"); document.body.style.overflow="hidden";
  $("#codeShare").hidden=!family; $("[data-code-copy]").hidden=!family; $("[data-code-close]").hidden=!family;
}
async function copyInvite(){
  const link=inviteLink();
  try{ await navigator.clipboard.writeText(link); toast("邀请链接已复制"); }catch(e){ window.prompt("长按复制这个链接",link); }
}
function closePicker(){ $("#pick").classList.remove("open"); document.body.style.overflow=""; }

/* ---------- boot ---------- */
render();
if(storedMe!=="hus" && storedMe!=="wife") openPicker(false);
else if(CLOUD && !family) openCode();
if(CLOUD){
  sync();
  setInterval(()=>{ if(document.visibilityState==="visible") sync(); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") sync(); });
  window.addEventListener("online",()=>sync());
}
})();
</script>
</body>
</html>
